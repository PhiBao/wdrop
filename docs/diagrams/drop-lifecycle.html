<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drop lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafafa;
      --color-ink:     #18181b;
      --color-muted:   #52525b;
      --color-accent:  #4d7c0f;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · wdrop</p>
    <h1>Drop lifecycle — every exit is final</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="drop-lifecycle-title drop-lifecycle-desc">
        <title id="drop-lifecycle-title">Drop lifecycle</title>
        <desc id="drop-lifecycle-desc">State machine showing a wdrop moving from Locked to exactly one of Claimed, Reclaimed, or Swept — the three one-way exits for USDC escrowed on Arc.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4d7c0f"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#fafafa"/>

        <!-- TRANSITIONS (drawn before states) -->
        <!-- start → Locked -->
        <line x1="86" y1="280" x2="140" y2="280" stroke="#52525b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Locked → Claimed (right+up elbow) -->
        <path d="M 340,262 H 412 Q 420,262 420,254 V 168 Q 420,160 428,160 H 580"
              fill="none" stroke="#52525b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Locked → Reclaimed (straight, accent: the undo) -->
        <line x1="340" y1="280" x2="580" y2="280" stroke="#4d7c0f" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Locked → Swept (right+down elbow, entering mid-height) -->
        <path d="M 340,298 H 492 Q 500,298 500,306 V 392 Q 500,400 508,400 H 580"
              fill="none" stroke="#52525b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- terminal → end rings -->
        <line x1="780" y1="160" x2="814" y2="160" stroke="#52525b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="780" y1="280" x2="814" y2="280" stroke="#52525b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="780" y1="400" x2="814" y2="400" stroke="#52525b" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- TRANSITION LABELS (mask + text, 6–10px clear of the stroke) -->
        <rect x="92" y="258" width="44" height="12" rx="2" fill="#fafafa"/>
        <text x="114" y="268" fill="#52525b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CREATE</text>

        <rect x="426" y="208" width="72" height="12" rx="2" fill="#fafafa"/>
        <text x="462" y="218" fill="#52525b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLAIM(SECRET)</text>

        <rect x="435" y="258" width="52" height="12" rx="2" fill="#fafafa"/>
        <text x="461" y="268" fill="#4d7c0f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RECLAIM()</text>

        <rect x="416" y="356" width="76" height="12" rx="2" fill="#fafafa"/>
        <text x="454" y="366" fill="#52525b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SWEEP(EXPIRED)</text>

        <!-- START DOT -->
        <circle cx="80" cy="280" r="6" fill="#18181b"/>

        <!-- STATE: Locked (initial) -->
        <rect x="140" y="240" width="200" height="80" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <text x="240" y="284" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Locked</text>
        <text x="240" y="302" fill="#52525b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">USDC held · TTL running</text>

        <!-- STATE: Claimed (store) -->
        <rect x="580" y="120" width="200" height="80" rx="8" fill="rgba(24,24,27,0.05)" stroke="#52525b" stroke-width="1"/>
        <text x="680" y="164" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claimed</text>
        <text x="680" y="182" fill="#52525b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">receiver took it</text>

        <!-- STATE: Reclaimed (focal · the undo) -->
        <rect x="580" y="240" width="200" height="80" rx="8" fill="rgba(77,124,15,0.08)" stroke="#4d7c0f" stroke-width="1"/>
        <text x="680" y="284" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reclaimed</text>
        <text x="680" y="302" fill="#52525b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sender undid it</text>

        <!-- STATE: Swept (external) -->
        <rect x="580" y="360" width="200" height="80" rx="8" fill="rgba(24,24,27,0.03)" stroke="rgba(24,24,27,0.30)" stroke-width="1"/>
        <text x="680" y="404" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Swept</text>
        <text x="680" y="422" fill="#52525b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">expired · returned</text>

        <!-- END RINGS -->
        <circle cx="830" cy="160" r="8" fill="none" stroke="#18181b" stroke-width="1"/>
        <circle cx="830" cy="160" r="5" fill="#18181b"/>
        <circle cx="830" cy="280" r="8" fill="none" stroke="#18181b" stroke-width="1"/>
        <circle cx="830" cy="280" r="5" fill="#18181b"/>
        <circle cx="830" cy="400" r="8" fill="none" stroke="#18181b" stroke-width="1"/>
        <circle cx="830" cy="400" r="5" fill="#18181b"/>

        <!-- ANNOTATION CALLOUT (italic serif, neutral) -->
        <text x="40" y="505" fill="#18181b" font-size="14" font-style="italic"
              font-family="'Instrument Serif', serif">after expiry the claim path closes — reclaim or sweep returns the USDC</text>
        <path d="M 488 497 Q 524 478 560 452" fill="none"
              stroke="rgba(24,24,27,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="564" cy="449" r="2" fill="#18181b"/>
      </svg>
    </div>
  </div>
</body>
</html>
