<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wdrop system overview</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #09090b;
      --color-ink:     #f4f4f5;
      --color-muted:   #a1a1aa;
      --color-accent:  #bef264;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · wdrop</p>
    <h1>How wdrop works</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-overview-dark-title system-overview-dark-desc">
        <title id="system-overview-dark-title">wdrop system overview</title>
        <desc id="system-overview-dark-desc">Architecture diagram showing the wdrop app and wallet in the browser, a same-origin RPC proxy, Arc RPC upstreams, and the WDrop escrow holding USDC on Arc mainnet.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1aa"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bef264"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#09090b"/>

        <!-- ZONE: browser (drawn before arrows and nodes) -->
        <rect x="180" y="74" width="600" height="144" rx="8" fill="rgba(244,244,245,0.02)" stroke="rgba(244,244,245,0.10)" stroke-width="0.8"/>
        <rect x="188" y="78" width="56" height="12" rx="2" fill="#09090b"/>
        <text x="216" y="87" fill="rgba(244,244,245,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BROWSER</text>

        <!-- ZONE: arc mainnet (drawn before arrows and nodes) -->
        <rect x="600" y="238" width="320" height="252" rx="8" fill="rgba(244,244,245,0.02)" stroke="rgba(244,244,245,0.10)" stroke-width="0.8"/>
        <rect x="608" y="242" width="104" height="12" rx="2" fill="#09090b"/>
        <text x="660" y="252" fill="rgba(244,244,245,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ARC MAINNET · 5042</text>

        <!-- ARROWS (drawn before nodes so lines sit behind boxes) -->
        <!-- app → wallet -->
        <line x1="440" y1="146" x2="520" y2="146" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- app → proxy -->
        <line x1="330" y1="182" x2="330" y2="250" stroke="#60a5fa" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- proxy → upstreams -->
        <line x1="360" y1="330" x2="360" y2="400" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- upstreams → escrow (up over, then right into the escrow's left edge) -->
        <path d="M 390,400 V 370 Q 390,362 398,362 H 622 Q 630,362 630,354 V 318 Q 630,310 638,310 H 660"
              fill="none" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- escrow → usdc (accent · money path) -->
        <line x1="760" y1="350" x2="760" y2="400" stroke="#bef264" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- ARROW LABELS (mask + text, 6–10px clear of the stroke) -->
        <rect x="458" y="124" width="44" height="12" rx="2" fill="#09090b"/>
        <text x="480" y="134" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SIGN</text>

        <rect x="338" y="204" width="64" height="12" rx="2" fill="#09090b"/>
        <text x="370" y="214" fill="#60a5fa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON-RPC</text>

        <rect x="476" y="344" width="68" height="12" rx="2" fill="#09090b"/>
        <text x="510" y="354" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ · WRITE</text>

        <rect x="768" y="364" width="90" height="12" rx="2" fill="#09090b"/>
        <text x="813" y="374" fill="#bef264" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOCK · PAYOUT</text>

        <!-- NODES -->
        <!-- Node: wdrop app (backend) -->
        <rect x="220" y="110" width="220" height="72" rx="6" fill="#09090b"/>
        <rect x="220" y="110" width="220" height="72" rx="6" fill="#18181b" stroke="#f4f4f5" stroke-width="1"/>
        <rect x="228" y="118" width="28" height="12" rx="2" fill="transparent" stroke="rgba(244,244,245,0.40)" stroke-width="0.8"/>
        <text x="242" y="127" fill="#f4f4f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="330" y="146" fill="#f4f4f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">wdrop app</text>
        <text x="330" y="164" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">create · claim · undo · receipts</text>

        <!-- Node: Wallet (input) -->
        <rect x="520" y="110" width="220" height="72" rx="6" fill="#09090b"/>
        <rect x="520" y="110" width="220" height="72" rx="6" fill="rgba(161,161,170,0.10)" stroke="#a1a1aa" stroke-width="1"/>
        <rect x="528" y="118" width="28" height="12" rx="2" fill="transparent" stroke="rgba(161,161,170,0.50)" stroke-width="0.8"/>
        <text x="542" y="127" fill="#a1a1aa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WLT</text>
        <text x="630" y="146" fill="#f4f4f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Wallet</text>
        <text x="630" y="164" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">injected · WalletConnect</text>

        <!-- Node: RPC proxy (backend) -->
        <rect x="250" y="250" width="220" height="80" rx="6" fill="#09090b"/>
        <rect x="250" y="250" width="220" height="80" rx="6" fill="#18181b" stroke="#f4f4f5" stroke-width="1"/>
        <rect x="258" y="258" width="36" height="12" rx="2" fill="transparent" stroke="rgba(244,244,245,0.40)" stroke-width="0.8"/>
        <text x="276" y="267" fill="#f4f4f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROXY</text>
        <text x="360" y="292" fill="#f4f4f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/api/rpc</text>
        <text x="360" y="310" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">same-origin · server-side</text>

        <!-- Node: RPC upstreams (external) -->
        <rect x="250" y="400" width="220" height="80" rx="6" fill="#09090b"/>
        <rect x="250" y="400" width="220" height="80" rx="6" fill="rgba(244,244,245,0.03)" stroke="rgba(244,244,245,0.30)" stroke-width="1"/>
        <rect x="258" y="408" width="28" height="12" rx="2" fill="transparent" stroke="rgba(244,244,245,0.30)" stroke-width="0.8"/>
        <text x="272" y="417" fill="#a1a1aa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="360" y="442" fill="#f4f4f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RPC upstreams</text>
        <text x="360" y="460" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">QuickNode · public fallback</text>

        <!-- Node: WDrop escrow (focal) -->
        <rect x="660" y="270" width="200" height="80" rx="6" fill="#09090b"/>
        <rect x="660" y="270" width="200" height="80" rx="6" fill="rgba(190,242,100,0.08)" stroke="#bef264" stroke-width="1"/>
        <rect x="668" y="278" width="28" height="12" rx="2" fill="transparent" stroke="rgba(190,242,100,0.50)" stroke-width="0.8"/>
        <text x="682" y="287" fill="#bef264" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ARC</text>
        <text x="760" y="312" fill="#f4f4f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WDrop escrow</text>
        <text x="760" y="330" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">0xEfFd…60F7</text>

        <!-- Node: USDC (store) -->
        <rect x="660" y="400" width="200" height="72" rx="6" fill="#09090b"/>
        <rect x="660" y="400" width="200" height="72" rx="6" fill="rgba(244,244,245,0.05)" stroke="#a1a1aa" stroke-width="1"/>
        <rect x="668" y="408" width="28" height="12" rx="2" fill="transparent" stroke="rgba(161,161,170,0.50)" stroke-width="0.8"/>
        <text x="682" y="417" fill="#a1a1aa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOK</text>
        <text x="760" y="436" fill="#f4f4f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">USDC</text>
        <text x="760" y="454" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">payment + gas</text>

        <!-- LEGEND -->
        <line x1="40" y1="516" x2="920" y2="516" stroke="rgba(244,244,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="532" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="544" width="14" height="10" rx="2" fill="rgba(190,242,100,0.08)" stroke="#bef264" stroke-width="1"/>
        <text x="62" y="553" fill="#a1a1aa" font-size="8.5" font-family="'Geist', sans-serif">Escrow (focal)</text>

        <rect x="200" y="544" width="14" height="10" rx="2" fill="#18181b" stroke="#f4f4f5" stroke-width="1"/>
        <text x="222" y="553" fill="#a1a1aa" font-size="8.5" font-family="'Geist', sans-serif">App / proxy</text>

        <rect x="360" y="544" width="14" height="10" rx="2" fill="rgba(161,161,170,0.10)" stroke="#a1a1aa" stroke-width="1"/>
        <text x="382" y="553" fill="#a1a1aa" font-size="8.5" font-family="'Geist', sans-serif">Wallet</text>

        <rect x="500" y="544" width="14" height="10" rx="2" fill="rgba(244,244,245,0.03)" stroke="rgba(244,244,245,0.30)" stroke-width="1"/>
        <text x="522" y="553" fill="#a1a1aa" font-size="8.5" font-family="'Geist', sans-serif">External</text>

        <rect x="650" y="544" width="14" height="10" rx="2" fill="rgba(244,244,245,0.05)" stroke="#a1a1aa" stroke-width="1"/>
        <text x="672" y="553" fill="#a1a1aa" font-size="8.5" font-family="'Geist', sans-serif">USDC (store)</text>
      </svg>
    </div>
  </div>
</body>
</html>
