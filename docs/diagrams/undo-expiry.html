<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undo and expiry paths</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafafa;
      --color-ink:     #18181b;
      --color-muted:   #52525b;
      --color-accent:  #4d7c0f;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · wdrop</p>
    <h1>Undo and expiry — two ways funds come back</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="undo-expiry-title undo-expiry-desc">
        <title id="undo-expiry-title">Undo and expiry paths</title>
        <desc id="undo-expiry-desc">Sequence diagram with two alternative paths for returning a locked drop to its sender: the sender reclaims before a claim, or anyone sweeps the drop back after it expires.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#fafafa"/>

        <!-- ALT FRAGMENT FRAME (drawn first — behind everything) -->
        <rect x="140" y="160" width="680" height="360" rx="4" fill="rgba(24,24,27,0.02)" stroke="rgba(24,24,27,0.22)" stroke-width="1"/>
        <rect x="140" y="160" width="40" height="16" rx="2" fill="#fafafa" stroke="rgba(24,24,27,0.22)" stroke-width="1"/>
        <text x="160" y="172" fill="#52525b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>

        <text x="152" y="200" fill="#52525b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[sender undo · before claim]</text>
        <text x="152" y="400" fill="#52525b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[expired · anyone can call]</text>

        <!-- Region divider -->
        <line x1="148" y1="368" x2="812" y2="368" stroke="rgba(24,24,27,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- LIFELINES -->
        <line x1="180" y1="124" x2="180" y2="540" stroke="rgba(24,24,27,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="124" x2="480" y2="540" stroke="rgba(24,24,27,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="780" y1="124" x2="780" y2="540" stroke="rgba(24,24,27,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ACTIVATION BARS -->
        <rect x="176" y="232" width="8" height="92" fill="rgba(24,24,27,0.06)" stroke="#52525b" stroke-width="0.8"/>
        <rect x="476" y="232" width="8" height="48" fill="rgba(24,24,27,0.06)" stroke="#52525b" stroke-width="0.8"/>
        <rect x="476" y="436" width="8" height="12" fill="rgba(24,24,27,0.06)" stroke="#52525b" stroke-width="0.8"/>
        <rect x="776" y="276" width="8" height="48" fill="rgba(24,24,27,0.06)" stroke="#52525b" stroke-width="0.8"/>
        <rect x="776" y="436" width="8" height="48" fill="rgba(24,24,27,0.06)" stroke="#52525b" stroke-width="0.8"/>

        <!-- MESSAGES -->
        <!-- Region 1: sender undo -->
        <line x1="184" y1="236" x2="476" y2="236" stroke="#52525b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="484" y1="280" x2="776" y2="280" stroke="#52525b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="776" y1="320" x2="184" y2="320" stroke="#52525b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- Region 2: expiry sweep -->
        <line x1="484" y1="440" x2="776" y2="440" stroke="#52525b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="776" y1="480" x2="184" y2="480" stroke="#52525b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- MESSAGE LABELS (mask + text, 6–10px clear of the stroke, clear of lifelines) -->
        <rect x="298" y="216" width="64" height="12" rx="2" fill="#fafafa"/>
        <text x="330" y="226" fill="#52525b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RECLAIM(ID)</text>

        <rect x="598" y="260" width="64" height="12" rx="2" fill="#fafafa"/>
        <text x="630" y="270" fill="#52525b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RECLAIM(ID)</text>

        <rect x="586" y="300" width="88" height="12" rx="2" fill="#fafafa"/>
        <text x="630" y="310" fill="#52525b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FULL AMOUNT BACK</text>

        <rect x="586" y="420" width="88" height="12" rx="2" fill="#fafafa"/>
        <text x="630" y="430" fill="#52525b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SWEEPEXPIRED()</text>

        <rect x="586" y="460" width="88" height="12" rx="2" fill="#fafafa"/>
        <text x="630" y="470" fill="#52525b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FULL AMOUNT BACK</text>

        <!-- ACTOR BOXES -->
        <!-- Sender -->
        <rect x="110" y="64" width="140" height="60" rx="6" fill="#fafafa"/>
        <rect x="110" y="64" width="140" height="60" rx="6" fill="rgba(82,82,91,0.10)" stroke="#71717a" stroke-width="1"/>
        <rect x="118" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(82,82,91,0.50)" stroke-width="0.8"/>
        <text x="132" y="81" fill="#52525b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USR</text>
        <text x="180" y="98" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sender</text>
        <text x="180" y="114" fill="#52525b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">holds the link</text>

        <!-- wdrop app -->
        <rect x="410" y="64" width="140" height="60" rx="6" fill="#fafafa"/>
        <rect x="410" y="64" width="140" height="60" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="418" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(24,24,27,0.40)" stroke-width="0.8"/>
        <text x="432" y="81" fill="#18181b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="480" y="98" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">wdrop app</text>
        <text x="480" y="114" fill="#52525b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">My drops buttons</text>

        <!-- WDrop (Arc) -->
        <rect x="710" y="64" width="140" height="60" rx="6" fill="#fafafa"/>
        <rect x="710" y="64" width="140" height="60" rx="6" fill="rgba(77,124,15,0.08)" stroke="#4d7c0f" stroke-width="1"/>
        <rect x="718" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(77,124,15,0.50)" stroke-width="0.8"/>
        <text x="732" y="81" fill="#4d7c0f" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ARC</text>
        <text x="780" y="98" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WDrop (Arc)</text>
        <text x="780" y="114" fill="#52525b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">0xEfFd…60F7</text>
      </svg>
    </div>
  </div>
</body>
</html>
