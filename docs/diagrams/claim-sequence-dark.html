<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claim flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #09090b;
      --color-ink:     #f4f4f5;
      --color-muted:   #a1a1aa;
      --color-accent:  #bef264;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · wdrop</p>
    <h1>Lock → share → claim</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="claim-sequence-dark-title claim-sequence-dark-desc">
        <title id="claim-sequence-dark-title">Claim flow</title>
        <desc id="claim-sequence-dark-desc">Sequence diagram showing a sender locking USDC behind a claim link on Arc, sharing it, and a receiver claiming it in one signature — funds arriving in under a second.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1aa"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bef264"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#a1a1aa" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#09090b"/>

        <!-- LIFELINES (behind everything) -->
        <line x1="136" y1="124" x2="136" y2="520" stroke="rgba(244,244,245,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="366" y1="124" x2="366" y2="520" stroke="rgba(244,244,245,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="596" y1="124" x2="596" y2="520" stroke="rgba(244,244,245,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="826" y1="124" x2="826" y2="520" stroke="rgba(244,244,245,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ACTIVATION BARS (before message arrows) -->
        <rect x="132" y="166" width="8" height="152" fill="rgba(244,244,245,0.06)" stroke="#a1a1aa" stroke-width="0.8"/>
        <rect x="362" y="166" width="8" height="336" fill="rgba(244,244,245,0.06)" stroke="#a1a1aa" stroke-width="0.8"/>
        <rect x="592" y="202" width="8" height="44" fill="rgba(244,244,245,0.06)" stroke="#a1a1aa" stroke-width="0.8"/>
        <rect x="592" y="382" width="8" height="48" fill="rgba(244,244,245,0.06)" stroke="#a1a1aa" stroke-width="0.8"/>
        <rect x="592" y="454" width="8" height="48" fill="rgba(244,244,245,0.06)" stroke="#a1a1aa" stroke-width="0.8"/>
        <rect x="822" y="346" width="8" height="156" fill="rgba(244,244,245,0.06)" stroke="#a1a1aa" stroke-width="0.8"/>

        <!-- MESSAGES (time flows top to bottom) -->
        <!-- m1 Sender → app -->
        <line x1="140" y1="170" x2="362" y2="170" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- m2 app → WDrop -->
        <line x1="370" y1="206" x2="592" y2="206" stroke="#60a5fa" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- m3 WDrop → app (return) -->
        <line x1="592" y1="242" x2="370" y2="242" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- m4 app → Sender (return) -->
        <line x1="362" y1="278" x2="140" y2="278" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- m5 Sender → Receiver (async share) -->
        <line x1="140" y1="314" x2="826" y2="314" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <!-- m6 Receiver → app -->
        <line x1="822" y1="350" x2="370" y2="350" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- m7 app → WDrop -->
        <line x1="370" y1="386" x2="592" y2="386" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- m8 WDrop → app (return) -->
        <line x1="592" y1="422" x2="370" y2="422" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- m9 Receiver → WDrop -->
        <line x1="822" y1="458" x2="592" y2="458" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- m10 WDrop → Receiver (headline success) -->
        <line x1="592" y1="494" x2="822" y2="494" stroke="#bef264" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- MESSAGE LABELS (mask + text) -->
        <rect x="207" y="150" width="88" height="12" rx="2" fill="#09090b"/>
        <text x="251" y="160" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AMOUNT + EXPIRY</text>

        <rect x="427" y="186" width="108" height="12" rx="2" fill="#09090b"/>
        <text x="481" y="196" fill="#60a5fa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPROVE + CREATE()</text>

        <rect x="449" y="222" width="64" height="12" rx="2" fill="#09090b"/>
        <text x="481" y="232" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CREATED(ID)</text>

        <rect x="221" y="258" width="60" height="12" rx="2" fill="#09090b"/>
        <text x="251" y="268" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLAIM LINK</text>

        <rect x="449" y="294" width="64" height="12" rx="2" fill="#09090b"/>
        <text x="481" y="304" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHARES LINK</text>

        <rect x="670" y="330" width="60" height="12" rx="2" fill="#09090b"/>
        <text x="700" y="340" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPENS LINK</text>

        <rect x="447" y="366" width="68" height="12" rx="2" fill="#09090b"/>
        <text x="481" y="376" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READS AMOUNT</text>

        <rect x="447" y="402" width="68" height="12" rx="2" fill="#09090b"/>
        <text x="481" y="412" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AMOUNT · TTL</text>

        <rect x="673" y="438" width="76" height="12" rx="2" fill="#09090b"/>
        <text x="711" y="448" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLAIM(SECRET)</text>

        <rect x="679" y="474" width="64" height="12" rx="2" fill="#09090b"/>
        <text x="711" y="484" fill="#bef264" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USDC IN &lt;1S</text>

        <!-- ACTOR BOXES -->
        <!-- Sender (input) -->
        <rect x="66" y="64" width="140" height="60" rx="6" fill="#09090b"/>
        <rect x="66" y="64" width="140" height="60" rx="6" fill="rgba(161,161,170,0.10)" stroke="#a1a1aa" stroke-width="1"/>
        <rect x="74" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(161,161,170,0.50)" stroke-width="0.8"/>
        <text x="88" y="81" fill="#a1a1aa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USR</text>
        <text x="136" y="98" fill="#f4f4f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sender</text>
        <text x="136" y="114" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lock + share</text>

        <!-- wdrop app (backend) -->
        <rect x="296" y="64" width="140" height="60" rx="6" fill="#09090b"/>
        <rect x="296" y="64" width="140" height="60" rx="6" fill="#18181b" stroke="#f4f4f5" stroke-width="1"/>
        <rect x="304" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(244,244,245,0.40)" stroke-width="0.8"/>
        <text x="318" y="81" fill="#f4f4f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="366" y="98" fill="#f4f4f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">wdrop app</text>
        <text x="366" y="114" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">simulates first</text>

        <!-- WDrop escrow (focal) -->
        <rect x="526" y="64" width="140" height="60" rx="6" fill="#09090b"/>
        <rect x="526" y="64" width="140" height="60" rx="6" fill="rgba(190,242,100,0.08)" stroke="#bef264" stroke-width="1"/>
        <rect x="534" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(190,242,100,0.50)" stroke-width="0.8"/>
        <text x="548" y="81" fill="#bef264" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ARC</text>
        <text x="596" y="98" fill="#f4f4f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WDrop (Arc)</text>
        <text x="596" y="114" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">0xEfFd…60F7</text>

        <!-- Receiver (input) -->
        <rect x="756" y="64" width="140" height="60" rx="6" fill="#09090b"/>
        <rect x="756" y="64" width="140" height="60" rx="6" fill="rgba(161,161,170,0.10)" stroke="#a1a1aa" stroke-width="1"/>
        <rect x="764" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(161,161,170,0.50)" stroke-width="0.8"/>
        <text x="778" y="81" fill="#a1a1aa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USR</text>
        <text x="826" y="98" fill="#f4f4f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Receiver</text>
        <text x="826" y="114" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no signup</text>

        <!-- LEGEND -->
        <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(244,244,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="556" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <line x1="140" y1="572" x2="168" y2="572" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="180" y="575" fill="#a1a1aa" font-size="8.5" font-family="'Geist', sans-serif">Request</text>

        <line x1="280" y1="572" x2="308" y2="572" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="320" y="575" fill="#a1a1aa" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

        <line x1="420" y1="572" x2="448" y2="572" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <text x="460" y="575" fill="#a1a1aa" font-size="8.5" font-family="'Geist', sans-serif">Async</text>

        <line x1="560" y1="572" x2="588" y2="572" stroke="#bef264" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="600" y="575" fill="#a1a1aa" font-size="8.5" font-family="'Geist', sans-serif">Success</text>
      </svg>
    </div>
  </div>
</body>
</html>
